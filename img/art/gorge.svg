    <path d="M190 330 V250 C190 222 230 222 230 250 V330Z" fill="#F2B866"/>
    <rect x="178" y="160" width="64" height="14" fill="#CDBB96"/>
    <path d="M830 330 L846 170 L894 170 L910 330Z" fill="#E6D7B8"/>
    <path d="M850 330 V250 C850 222 890 222 890 250 V330Z" fill="#F2B866"/>
    <rect x="838" y="160" width="64" height="14" fill="#CDBB96"/>
    <!-- deck -->
    <path d="M150 340 C400 360 680 360 930 340" stroke="#12201A" stroke-width="14" fill="none"/>
    <!-- main chains -->
    <path d="M210 176 C400 330 680 330 870 176" stroke="#12201A" stroke-width="10" fill="none"/>
    <path d="M210 176 L60 330 M870 176 L1020 330" stroke="#12201A" stroke-width="8"/>
    <!-- hangers -->
    <g stroke="#12201A" stroke-width="3">
      <path d="M260 214 V344 M310 246 V349 M360 270 V353 M410 286 V355 M460 296 V357 M510 301 V357 M560 301 V357 M610 297 V356 M660 287 V354 M710 271 V352 M760 248 V348 M810 216 V344"/>
