      <stop offset="0" stop-color="#F2B866"/><stop offset="0.7" stop-color="#F7E2BC"/><stop offset="1" stop-color="#F6F4EE"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#sky)"/>
  <circle cx="540" cy="520" r="150" fill="#F6F4EE" opacity="0.7"/>
  <!-- distant hills -->
  <path d="M0 640 C200 600 400 650 540 620 C700 590 880 640 1080 610 V800 H0Z" fill="#B7C9A6"/>
