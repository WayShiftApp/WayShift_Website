  <!-- young engineer with drawing, foreground left -->
  <g transform="translate(470 820)">
    <path d="M-30 210 L-40 300 L-24 300 L-10 220Z M20 210 L34 300 L50 296 L36 214Z" fill="#12201A"/>
    <path d="M-44 60 C-48 26 -16 10 10 10 C40 12 56 30 52 66 L48 220 L-36 220Z" fill="#12201A"/>
    <path d="M-36 120 L48 120" stroke="#4F5B52" stroke-width="4"/>
    <circle cx="6" cy="-16" r="30" fill="#E2B08C"/>
    <rect x="-22" y="-120" width="56" height="86" fill="#12201A"/>
    <rect x="-38" y="-40" width="88" height="10" fill="#12201A"/>
    <path d="M-6 6 C-4 20 20 20 22 6" stroke="#F6F4EE" stroke-width="10" fill="none"/>
    <!-- drawing board -->
    <g transform="rotate(-12 120 60)">
      <rect x="60" y="0" width="190" height="130" fill="#F6F4EE"/>
      <rect x="60" y="0" width="190" height="130" fill="none" stroke="#2F5D8A" stroke-width="4"/>
      <path d="M80 90 C130 130 180 130 230 90 M80 90 V40 M230 90 V40 M80 40 C130 80 180 80 230 40" stroke="#2F5D8A" stroke-width="4" fill="none"/>
