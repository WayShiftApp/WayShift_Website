  <path d="M1080 340 L960 350 L880 430 L920 450 L990 410 L1080 420Z" fill="#2E7D4F"/>
  <path d="M960 530 L850 570 M930 670 L810 700 M890 810 L770 850" stroke="#8C7F64" stroke-width="8"/>
