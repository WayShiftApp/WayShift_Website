<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B48E"/><stop offset="0.55" stop-color="#E8D9B4"/><stop offset="1" stop-color="#D9DCCB"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F4EE" stop-opacity="0"/><stop offset="0.5" stop-color="#F6F4EE" stop-opacity="0.75"/><stop offset="1" stop-color="#F6F4EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#sky)"/>
  <circle cx="540" cy="360" r="130" fill="#F6F4EE" opacity="0.85"/>
  <!-- distant trees -->
  <path d="M0 560 C80 520 140 540 220 520 C300 500 360 540 440 526 C540 510 620 540 720 524 C820 508 900 540 1080 520 V640 H0Z" fill="#7F8F74"/>
  <rect x="0" y="560" width="1080" height="90" fill="url(#mist)"/>
  <!-- heath -->
  <path d="M0 640 C300 620 700 650 1080 628 V1080 H0Z" fill="#8E9E6C"/>
  <path d="M0 760 C320 740 720 780 1080 750 V1080 H0Z" fill="#7C8C5C"/>
  <g fill="#5C6E48"><ellipse cx="80" cy="800" rx="110" ry="40"/><ellipse cx="1000" cy="820" rx="120" ry="44"/></g>
  <g fill="#F2A23A"><circle cx="60" cy="786" r="6"/><circle cx="100" cy="780" r="5"/><circle cx="980" cy="806" r="6"/><circle cx="1030" cy="800" r="5"/></g>
  <!-- seconds, far back -->
  <g fill="#3A4A40" opacity="0.8">
    <circle cx="80" cy="600" r="16"/><rect x="66" y="616" width="28" height="70" rx="8"/>
    <circle cx="1000" cy="600" r="16"/><rect x="986" y="616" width="28" height="70" rx="8"/>
    <rect x="970" y="588" width="60" height="6"/><rect x="50" y="588" width="60" height="6"/>
  </g>
  <!-- duellist left (Pitt), firing right -->
  <g fill="#12201A" transform="translate(240 690)">
    <path d="M-20 160 L-34 320 L-16 320 L0 190 L12 190 L26 320 L44 320 L32 160Z"/>
    <path d="M-40 40 C-44 0 -14 -14 6 -14 C34 -12 50 6 46 44 L44 120 L60 190 L-50 190 L-36 120Z"/>
    <path d="M40 30 L120 14" stroke="#12201A" stroke-width="20" stroke-linecap="round"/>
    <path d="M118 4 L160 -2 L161 12 L122 22Z"/>
    <circle cx="4" cy="-46" r="28" fill="#D9A07E"/>
    <path d="M-28 -52 C-30 -84 36 -86 36 -54 C24 -64 -18 -64 -28 -52Z" fill="#F6F4EE"/>
    <path d="M-12 -12 C-6 4 14 4 20 -12" fill="#F6F4EE"/>
  </g>
  <!-- duellist right (Tierney), firing left -->
  <g fill="#045022" transform="translate(840 690)">
    <path d="M-20 160 L-34 320 L-16 320 L0 190 L12 190 L26 320 L44 320 L32 160Z" fill="#12201A"/>
    <path d="M-40 40 C-44 0 -14 -14 6 -14 C34 -12 50 6 46 44 L44 120 L60 190 L-50 190 L-36 120Z"/>
    <path d="M-34 30 L-114 14" stroke="#045022" stroke-width="20" stroke-linecap="round"/>
    <path d="M-112 4 L-154 -2 L-155 12 L-116 22Z" fill="#12201A"/>
    <circle cx="4" cy="-46" r="28" fill="#C98E6B"/>
    <path d="M-34 -60 L44 -60 L30 -80 L4 -74 L-22 -80Z" fill="#12201A"/>
    <path d="M-12 -12 C-6 4 14 4 20 -12" fill="#F6F4EE"/>
  </g>
  <!-- muzzle smoke -->
  <g fill="#F6F4EE" opacity="0.9">
    <circle cx="420" cy="692" r="20"/><circle cx="444" cy="680" r="14"/><circle cx="436" cy="708" r="12"/>
    <circle cx="666" cy="692" r="20"/><circle cx="642" cy="680" r="14"/><circle cx="650" cy="708" r="12"/>
  </g>
  <!-- both shots sail high and wide -->
  <g stroke="#F2A23A" stroke-width="4" stroke-dasharray="6 10" fill="none" stroke-linecap="round">
    <path d="M460 684 C620 640 760 590 900 560"/>
    <path d="M626 684 C470 640 330 590 180 560"/>
  </g>
  <text x="940" y="540" font-family="Georgia" font-size="40" font-weight="bold" fill="#12201A" text-anchor="middle">miss</text>
  <text x="140" y="540" font-family="Georgia" font-size="40" font-weight="bold" fill="#12201A" text-anchor="middle">miss</text>
</svg>
