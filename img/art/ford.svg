<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9A8"/><stop offset="0.6" stop-color="#EFE6D2"/><stop offset="1" stop-color="#E3E8DF"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7D2C8"/><stop offset="1" stop-color="#7FA99C"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#sky)"/>
  <circle cx="300" cy="330" r="100" fill="#F2A23A" opacity="0.85"/>
  <circle cx="300" cy="330" r="160" fill="#F2A23A" opacity="0.12"/>
  <!-- far bank: wooded, with a few round huts -->
  <path d="M0 470 C120 440 240 460 360 450 C500 438 640 466 780 452 C900 440 1000 458 1080 450 V540 H0Z" fill="#7F9F84"/>
  <g fill="#5F8268"><circle cx="80" cy="450" r="50"/><circle cx="160" cy="440" r="60"/><circle cx="900" cy="440" r="56"/><circle cx="990" cy="450" r="50"/></g>
  <g><path d="M620 470 L660 420 L700 470Z" fill="#8E7D60"/><rect x="626" y="470" width="68" height="26" fill="#A6977A"/>
     <path d="M720 476 L750 440 L780 476Z" fill="#8E7D60"/><rect x="725" y="476" width="50" height="20" fill="#A6977A"/>
     <path d="M648 420 C640 390 670 380 660 350" stroke="#C9D3C4" stroke-width="6" fill="none" opacity="0.8"/></g>
  <!-- water, very shallow -->
  <rect x="0" y="530" width="1080" height="320" fill="url(#water)"/>
  <!-- exposed gravel bar of the ford, crossing diagonally -->
  <path d="M120 850 C300 760 520 680 760 600 C860 568 960 548 1080 540 V570 C960 580 870 600 780 630 C560 700 340 790 200 870Z" fill="#D7C9A8"/>
  <g fill="#B8A889"><ellipse cx="300" cy="790" rx="16" ry="8"/><ellipse cx="460" cy="730" rx="12" ry="6"/><ellipse cx="640" cy="660" rx="14" ry="7"/><ellipse cx="840" cy="600" rx="12" ry="6"/></g>
  <path d="M40 600 H200 M300 640 H420 M820 690 H980 M600 780 H760 M100 700 H220" stroke="#F6F4EE" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- reeds foreground -->
  <path d="M0 850 H1080 V1080 H0Z" fill="#9DBF8F"/>
  <path d="M0 880 C300 860 700 900 1080 870 V1080 H0Z" fill="#8CB27E"/>
  <g stroke="#5F8268" stroke-width="6" stroke-linecap="round">
    <path d="M40 1080 L60 900 M70 1080 L80 880 M100 1080 L130 920 M940 1080 L920 900 M980 1080 L990 880 M1020 1080 L1050 910"/>
  </g>
  <g fill="#7A4E2C"><ellipse cx="80" cy="878" rx="8" ry="22"/><ellipse cx="990" cy="878" rx="8" ry="22"/></g>
  <!-- settlers wading the ford -->
  <g>
    <!-- leader with spear -->
    <g transform="translate(560 640)">
      <path d="M-30 40 C-34 0 -10 -16 6 -16 C26 -16 40 0 36 40 L34 90 L-26 90Z" fill="#8E5A30"/>
      <path d="M-30 50 L34 50" stroke="#5A3418" stroke-width="6"/>
      <circle cx="4" cy="-40" r="22" fill="#C98E6B"/>
      <path d="M-20 -50 C-18 -76 28 -76 28 -46 L20 -56 L-14 -56Z" fill="#7A4E2C"/>
      <path d="M40 -120 L30 120" stroke="#3A2416" stroke-width="7" stroke-linecap="round"/>
      <path d="M40 -120 l-10 -26 l18 22Z" fill="#9A9483"/>
      <path d="M-40 90 C-20 104 30 104 50 90" stroke="#F6F4EE" stroke-width="6" fill="none" opacity="0.8"/>
    </g>
    <!-- woman with bundle -->
    <g transform="translate(420 700)">
      <path d="M-28 40 C-32 0 -10 -14 4 -14 C22 -14 36 0 32 40 L30 90 L-24 90Z" fill="#C4623A"/>
      <circle cx="4" cy="-36" r="20" fill="#E2B08C"/>
      <path d="M-18 -44 C-18 -70 26 -70 26 -40 C30 -20 20 0 22 20 L-14 20 C-10 0 -22 -20 -18 -44Z" fill="#5A3418"/>
      <ellipse cx="-30" cy="-10" rx="30" ry="22" fill="#D7C9A8"/>
      <path d="M-56 -14 L-4 -6" stroke="#8E7D60" stroke-width="4"/>
      <path d="M-36 90 C-16 104 30 104 48 90" stroke="#F6F4EE" stroke-width="6" fill="none" opacity="0.8"/>
    </g>
    <!-- child -->
    <g transform="translate(330 760) scale(0.72)">
      <path d="M-28 40 C-32 0 -10 -14 4 -14 C22 -14 36 0 32 40 L30 90 L-24 90Z" fill="#045022"/>
      <circle cx="4" cy="-36" r="20" fill="#C98E6B"/>
      <path d="M-16 -46 C-16 -66 24 -66 24 -42Z" fill="#3A2416"/>
      <path d="M-36 90 C-16 104 30 104 48 90" stroke="#F6F4EE" stroke-width="7" fill="none" opacity="0.8"/>
    </g>
    <!-- cow led on rope -->
    <g transform="translate(700 610)">
      <path d="M-60 0 C-60 -30 60 -34 66 0 L60 40 L-54 40Z" fill="#7A4E2C"/>
      <circle cx="-74" cy="-10" r="22" fill="#7A4E2C"/>
      <path d="M-90 -26 l-14 -14 M-62 -28 l10 -16" stroke="#F6F4EE" stroke-width="5" stroke-linecap="round"/>
      <path d="M-50 40 v18 M-24 40 v18 M30 40 v18 M52 40 v18" stroke="#7A4E2C" stroke-width="10"/>
      <path d="M-80 54 C-50 66 50 66 80 54" stroke="#F6F4EE" stroke-width="6" fill="none" opacity="0.8"/>
      <path d="M-96 -4 C-120 20 -130 40 -136 30" stroke="#D7C9A8" stroke-width="3" fill="none"/>
    </g>
  </g>
  <!-- herons -->
  <g stroke="#12201A" stroke-width="5" fill="none" stroke-linecap="round"><path d="M820 300 q16 -14 32 0 q16 -14 32 0 M900 250 q10 -10 20 0 q10 -10 20 0"/></g>
</svg>
