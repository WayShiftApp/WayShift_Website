    <path d="M30 -60 L200 90" stroke="#5A3418" stroke-width="12" stroke-linecap="round"/>
    <path d="M-200 82 l-36 34 l18 10 l30 -32Z M210 82 l36 34 l-18 10 l-30 -32Z" fill="#5A3418"/>
