    <rect x="80" y="760" width="160" height="5" rx="3"/><rect x="420" y="820" width="220" height="5" rx="3"/><rect x="820" y="880" width="180" height="5" rx="3"/>
  </g>
  <!-- the ferry -->
  <g transform="translate(540 820)">
