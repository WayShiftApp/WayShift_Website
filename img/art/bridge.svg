      <path d="M300 600 C300 530 420 530 420 600Z"/>
      <path d="M470 600 C470 520 610 520 610 600Z"/>
      <path d="M660 600 C660 530 780 530 780 600Z"/>
      <path d="M830 600 C830 540 930 540 930 600Z"/>
    </g>
    <g fill="#BCA882">
      <path d="M250 600 L262 500 L288 500 L300 600Z"/><path d="M420 600 L432 500 L458 500 L470 600Z"/>
      <path d="M610 600 L622 500 L648 500 L660 600Z"/><path d="M780 600 L792 500 L818 500 L830 600Z"/>
    </g>
    <g fill="#12201A"><rect x="200" y="440" width="6" height="30"/><rect x="380" y="440" width="6" height="30"/><rect x="560" y="440" width="6" height="30"/><rect x="740" y="440" width="6" height="30"/><rect x="900" y="440" width="6" height="30"/>
      <circle cx="203" cy="436" r="9"/><circle cx="383" cy="436" r="9"/><circle cx="563" cy="436" r="9"/><circle cx="743" cy="436" r="9"/><circle cx="903" cy="436" r="9"/></g>
  </g>
