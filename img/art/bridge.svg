      <stop offset="0" stop-color="#F2B866"/><stop offset="0.6" stop-color="#F7DDB0"/><stop offset="1" stop-color="#F6F0E2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C98F"/><stop offset="0.35" stop-color="#9CC0B4"/><stop offset="1" stop-color="#5E9988"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#sky)"/>
  <circle cx="760" cy="330" r="110" fill="#F6F4EE" opacity="0.9"/>
  <circle cx="760" cy="330" r="170" fill="#F6F4EE" opacity="0.18"/>
  <!-- birds -->
  <path d="M300 240 q14 -14 28 0 q14 -14 28 0 M380 200 q10 -10 20 0 q10 -10 20 0 M240 300 q8 -8 16 0 q8 -8 16 0" stroke="#12201A" stroke-width="4" fill="none" stroke-linecap="round"/>
